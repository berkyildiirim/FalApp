<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FalApp — Admin Panel</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141225">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="wordmark" href="index.html">Fal<span>App</span> <span class="admin-badge">Admin</span></a>
    <div class="header-actions" style="margin-left:auto;">
      <span id="adminWhoami" class="admin-whoami"></span>
      <button class="btn btn-ghost" id="adminLogoutBtn" type="button" hidden>Çıkış yap</button>
    </div>
  </div>
</header>

<main class="wrap admin-wrap">

  <!-- Giriş yapılmamışsa -->
  <section id="adminLoginSection" class="admin-panel" hidden>
    <h1>Admin girişi</h1>
    <p class="section-sub">Bu sayfa sadece yöneticiler içindir. E-posta ve şifrenle giriş yap.</p>
    <form class="auth-form admin-login-form" id="adminLoginForm">
      <label>E-posta
        <input type="email" id="adminEmail" required autocomplete="email">
      </label>
      <label>Şifre
        <input type="password" id="adminPassword" required autocomplete="current-password">
      </label>
      <p class="auth-msg" id="adminLoginMsg"></p>
      <button class="btn btn-primary auth-submit" type="submit">Giriş Yap</button>
    </form>
  </section>

  <!-- Giriş yapılmış ama admin değilse -->
  <section id="adminDeniedSection" class="admin-panel" hidden>
    <h1>Erişim yok</h1>
    <p class="section-sub">Bu hesabın admin yetkisi yok. Ana sayfaya dönebilirsin.</p>
    <a class="btn btn-ghost" href="index.html">Ana sayfaya dön</a>
  </section>

  <!-- Admin paneli -->
  <section id="adminDashboard" hidden>

    <div class="admin-panel">
      <h1 id="falciFormBaslik">Yeni falcı ekle</h1>
      <form id="falciForm" class="admin-form">
        <input type="hidden" id="falciId">
        <div class="admin-form-grid">
          <label>Ad Soyad
            <input type="text" id="falciAd" required>
          </label>
          <label>Uzmanlık
            <input type="text" id="falciUzmanlik" required placeholder="Kahve falı, Tarot...">
          </label>
          <label>Deneyim (yıl)
            <input type="number" id="falciDeneyim" min="0" value="1" required>
          </label>
          <label>Puan
            <input type="number" id="falciPuan" min="0" max="5" step="0.1" value="5.0" required>
          </label>
          <label>Yorum sayısı
            <input type="number" id="falciYorumSayisi" min="0" value="0" required>
          </label>
          <label>Durum
            <select id="falciDurum">
              <option value="musait">Müsait</option>
              <option value="mesgul">Meşgul</option>
            </select>
          </label>
          <label>Meşgulse not (ör: "12 dk sonra müsait")
            <input type="text" id="falciBeklemeNotu">
          </label>
          <label>Avatar kısaltma (ör: AH)
            <input type="text" id="falciAvatarKisaltma" maxlength="3" required>
          </label>
          <label>Avatar renk tonu (0-360)
            <input type="number" id="falciAvatarHue" min="0" max="360" value="0">
          </label>
          <label>İletişim linki (WhatsApp vb.)
            <input type="text" id="falciLink" required value="https://wa.me/905555555555">
          </label>
          <label>Buton metni
            <input type="text" id="falciButonMetni" value="Yaz" required>
          </label>
          <label>Sıra
            <input type="number" id="falciSira" value="0">
          </label>
        </div>
        <p class="auth-msg" id="falciFormMsg"></p>
        <div class="admin-form-actions">
          <button class="btn btn-primary" type="submit" id="falciKaydetBtn">Ekle</button>
          <button class="btn btn-ghost" type="button" id="falciVazgecBtn" hidden>Vazgeç</button>
        </div>
      </form>
    </div>

    <div class="admin-panel">
      <h1>Falcılar</h1>
      <div class="admin-table-wrap">
        <table class="admin-table" id="falciTable">
          <thead>
            <tr><th>Ad</th><th>Uzmanlık</th><th>Durum</th><th>Puan</th><th>Sıra</th><th></th></tr>
          </thead>
          <tbody id="falciTableBody">
            <tr><td colspan="6">Yükleniyor...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="admin-panel">
      <h1>Üyeler</h1>
      <div class="admin-table-wrap">
        <table class="admin-table" id="uyeTable">
          <thead>
            <tr><th>Ad Soyad</th><th>E-posta</th><th>Kayıt tarihi</th></tr>
          </thead>
          <tbody id="uyeTableBody">
            <tr><td colspan="3">Yükleniyor...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
